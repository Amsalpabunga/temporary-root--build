
name: Build Temporary Root APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract patched source
        run: |
          mkdir -p source
          ZIP=$(find . -maxdepth 1 -name '*patched*source*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Patched source ZIP tidak ditemukan"
            exit 1
          fi

          unzip -q "$ZIP" -d source

          SRC=$(find source -name gradlew -type f | head -n 1)

          if [ -z "$SRC" ]; then
            echo "gradlew tidak ditemukan"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$SRC")" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip cmake ninja-build

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TemporaryRoot-debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          
