
name: Build Temporary Root APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Extract source ZIP
        run: |
          mkdir -p source
          unzip -o TemporaryRoot_SukiSU_r2_patched_source.zip -d source

      - name: Locate Gradle project
        run: |
          find source -name gradlew -type f

      - name: Build APK
        run: |
          GRADLEW=$(find source -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew tidak ditemukan dalam source ZIP"
            exit 1
          fi
          cd "$(dirname "$GRADLEW")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TemporaryRoot-APK
          path: source/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
