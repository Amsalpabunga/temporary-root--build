
name: Build Temporary Root APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Siapkan Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Periksa isi repository
      - name: List repository files
        run: |
          echo "=== Repository files ==="
          find . -maxdepth 5 -type f | sort

      # 4. Cari ZIP source
      - name: Find source ZIP
        id: source
        shell: bash
        run: |
          ZIP=$(find . -type f \
            -iname '*patched*source*.zip' \
            ! -path './source/*' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "::error::Source ZIP tidak ditemukan"
            exit 1
          fi

          echo "Source ZIP ditemukan: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      # 5. Ekstrak source
      - name: Extract source
        run: |
          mkdir -p source
          unzip -o "${{ steps.source.outputs.zip }}" -d source

      # 6. Cari Gradle Wrapper
      - name: Locate Gradle project
        id: gradle
        shell: bash
        run: |
          GRADLEW=$(find source -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew tidak ditemukan"
            echo "Isi folder source:"
            find source -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Gradle project: $PROJECT_DIR"
          echo "gradlew=$GRADLEW" >> "$GITHUB_OUTPUT"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # 7. Build APK
      - name: Build Debug APK
        working-directory: ${{ steps.gradle.outputs.project_dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # 8. Periksa hasil APK
      - name: Verify APK
        working-directory: ${{ steps.gradle.outputs.project_dir }}
        run: |
          echo "=== APK output ==="
          find . -type f -path '*/build/outputs/apk/*.apk'

          APK=$(find . -type f \
            -path '*/build/outputs/apk/debug/*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::APK tidak berhasil dibuat"
            exit 1
          fi

          echo "APK berhasil dibuat: $APK"

      # 9. Upload APK sebagai artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TemporaryRoot-APK
          path: |
            ${{ steps.gradle.outputs.project_dir }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
          
