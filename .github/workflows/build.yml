
name: Build Temporary Root APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: List repository files
        run: |
          echo "=== Repository ==="
          find . -maxdepth 4 -type f | sort

      - name: Find source ZIP
        id: source
        shell: bash
        run: |
          ZIP=$(find . -type f \
            -iname '*patched*source*.zip' \
            ! -path './source/*' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "::error::Source ZIP tidak ditemukan"
            find . -type f
            exit 1
          fi

          echo "Found: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract source
        run: |
          mkdir -p source
          unzip -o "${{ steps.source.outputs.zip }}" -d source

      - name: Locate Gradle project
        id: gradle
        shell: bash
        run: |
          GRADLEW=$(find source -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew tidak ditemukan"
            find source -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Project: $PROJECT_DIR"
          echo "gradle=$GRADLEW" >> "$GITHUB_OUTPUT"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        working-directory: ${{ steps.gradle.outputs.project_dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          echo "=== APK files ==="
          find source -type f -name '*.apk'

          APK=$(find source -type f \
            -path '*/build/outputs/apk/debug/*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::APK tidak ditemukan"
            exit 1
          fi

          echo "APK berhasil dibuat: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TemporaryRoot-APK
          path: source/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
          
